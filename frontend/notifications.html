<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

    <div class="sidebar">
       <div class="logo">
            <div class="logo-icon">F</div>
            <div>
                <h2>Food Delivery</h2>
                <span>Ecosystem Hub</span>
            </div>
        </div>

        <div class="navigation">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="restaurants.html" class="nav-link">Restaurants</a>
            <a href="orders.html" class="nav-link">Orders</a>
            <a href="payments.html" class="nav-link">Payments</a>
            <a href="deliveries.html" class="nav-link">Deliveries</a>
            <a href="notifications.html" class="nav-link active">Notifications</a>
            <a href="customers.html" class="nav-link">Customers</a>
        </div>

        <div class="sidebar-bottom">
            <div class="system-status">
                <span id="service-status" class="status-dot"></span>
                System Live
            </div>
        </div>
    </div>

    <div class="main">

        <div class="topbar">
            <div>
                <div class="page-label">SYSTEM NOTIFICATIONS</div>
                <h1>Notifications & System Logs</h1>
            </div>
        </div>

        <div class="content">

            <div class="welcome">
                <div>
                    <h2>Notification Feed</h2>
                    <p>View system notifications from Port :8087.</p>
                </div>

                <button class="refresh-btn" onclick="loadNotifications()">
                    Refresh
                </button>
            </div>

            <div class="section-header">
                <h2>Recent Notifications</h2>
            </div>

            <div class="notification-container" id="notifications-list">
                <p style="text-align:center;">Loading notifications...</p>
            </div>

        </div>
    </div>

</div>

<script src="js/notifications.js"></script>

</body>
</html>
